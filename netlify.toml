[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions-v2"
  node_bundler = "esbuild"

[dev]
  command = "npm run build -- --watch"
  port = 3000
  publish = "dist"
  functionsPort = 9999
  autoLaunch = false

[context.production.environment]
  NODE_VERSION = "22"

[context.deploy-preview.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/v1/dashboard"
  to = "/.netlify/functions/dashboard"
  status = 200

[[redirects]]
  from = "/api/v1/bootstrap-data"
  to = "/.netlify/functions/bootstrap-data"
  status = 200

[[redirects]]
  from = "/api/v1/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/v1/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/v1/prescriptions"
  to = "/.netlify/functions/prescriptions"
  status = 200

[[redirects]]
  from = "/api/v1/sales"
  to = "/.netlify/functions/sales"
  status = 200

[[redirects]]
  from = "/api/v1/tenders"
  to = "/.netlify/functions/tenders"
  status = 200

[[redirects]]
  from = "/api/v1/admin-data"
  to = "/.netlify/functions/admin-data"
  status = 200

[[redirects]]
  from = "/api/v1/data-transfer"
  to = "/.netlify/functions/data-transfer"
  status = 200

[[redirects]]
  from = "/api/v1/data-sale-import"
  to = "/.netlify/functions/data-sale-import"
  status = 200

[[redirects]]
  from = "/api/v1/lost-sales-trigger"
  to = "/.netlify/functions/lost-sales-trigger"
  status = 200

[[redirects]]
  from = "/api/v1/daily-reminders"
  to = "/.netlify/functions/daily-reminders"
  status = 200

[[redirects]]
  from = "/api/v1/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/seed-data.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
